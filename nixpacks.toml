# Nixpacks build config for Railway.
# Pins the PHP version + ensures the extensions Laravel/Filament need are installed.

[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "php82Extensions.bcmath",
  "php82Extensions.curl",
  "php82Extensions.dom",
  "php82Extensions.fileinfo",
  "php82Extensions.gd",
  "php82Extensions.intl",
  "php82Extensions.mbstring",
  "php82Extensions.mysqli",
  "php82Extensions.openssl",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.sqlite3",
  "php82Extensions.tokenizer",
  "php82Extensions.xml",
  "php82Extensions.zip",
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = ["php artisan storage:link || true"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php -S 0.0.0.0:$PORT -t public public/index.php"
