# Nixpacks build config for Railway.
# Pins PHP 8.4 (matches the local dev version composer.lock was generated against)
# and pre-installs the extensions Laravel/Filament need.

[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "php84Extensions.bcmath",
  "php84Extensions.curl",
  "php84Extensions.dom",
  "php84Extensions.fileinfo",
  "php84Extensions.gd",
  "php84Extensions.intl",
  "php84Extensions.mbstring",
  "php84Extensions.mysqli",
  "php84Extensions.openssl",
  "php84Extensions.pdo",
  "php84Extensions.pdo_mysql",
  "php84Extensions.sqlite3",
  "php84Extensions.tokenizer",
  "php84Extensions.xml",
  "php84Extensions.zip",
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = ["php artisan storage:link || true"]

[start]
# Migrations run automatically on every deploy (idempotent).
# Seeders are NOT run automatically — they'd overwrite admin-edited settings
# on every restart. After the first deploy, open Railway's shell on this
# service and run ONCE:  php artisan db:seed --force
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php -S 0.0.0.0:$PORT -t public public/index.php"
